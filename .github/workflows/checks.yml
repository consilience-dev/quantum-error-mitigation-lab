name: Validate circuit splits and scores
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: pip install -r requirements-audit.txt
      - run: python scripts/fetch_upstream.py
      - run: python scripts/summarize_paired.py --check
      - run: python scripts/simulation_verify.py
      - run: python scripts/summarize_qermit_panel.py --check
      - name: Verify scores against the ML-QEM source workbook
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/ml-qem-source.xlsx" \
            "https://raw.githubusercontent.com/qiskit-community/ml-qem/faf3e44ac686d62b2184a983d89e655084759a26/docs/paper_figures/ML-QEM%20Source%20data.xlsx"
          python scripts/verify_figure4.py --check --workbook "$RUNNER_TEMP/ml-qem-source.xlsx"
          python scripts/simulation_fig3_verify.py --check --workbook "$RUNNER_TEMP/ml-qem-source.xlsx"
          python scripts/simulation_depth_transfer.py verify --workbook "$RUNNER_TEMP/ml-qem-source.xlsx"
